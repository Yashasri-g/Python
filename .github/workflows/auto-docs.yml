name: Auto-Generate Docs

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            This is a Python learning repository. Do the following:
            1. Scan ALL .py files in all folders (Practice/, Leetcode/,
               ASSIGNMENT 2/, Assignment 3/, and root files)
            2. Update README.md with:
               - A folder structure tree
               - A table listing every .py file, its folder,
                 what it does, and Python concepts it demonstrates
            3. Update docs/TOPICS.md with all Python concepts found
            4. Update docs/LEETCODE.md with all Leetcode solutions table
            5. Commit all changes with: docs: auto-update docs [skip ci]
