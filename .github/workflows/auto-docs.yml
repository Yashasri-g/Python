name: Auto-Generate Docs on PR

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**/*.py'

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            This is a Python learning repository. Do the following:
            1. Scan ALL .py files in Practice/, Leetcode/,
               ASSIGNMENT 2/, Assignment 3/, and root files
            2. Update README.md with a folder structure tree
               and a table of every .py file with what it does
               and Python concepts it demonstrates
            3. Update docs/TOPICS.md with all Python concepts found
            4. Update docs/LEETCODE.md with all Leetcode solutions
            5. Commit changes with: docs: auto-update docs [skip ci]
